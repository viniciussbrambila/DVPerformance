version: 2
updates:
  # Verifica semanalmente atualizacoes de pacotes do Back-end (.NET / NuGet)
  - package-ecosystem: "nuget"
    directory: "/Back-end/DVPerformance"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # Verifica semanalmente atualizacoes de pacotes do Front-end (npm)
  - package-ecosystem: "npm"
    directory: "/Front-end"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

  # Mantem as versoes das proprias GitHub Actions atualizadas
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
