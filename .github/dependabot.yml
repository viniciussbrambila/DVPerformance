version: 2
updates:
  # Atua SOMENTE para alertas criticos de seguranca (open-pull-requests-limit: 0 desativa atualizacoes comuns de versao)
  - package-ecosystem: "nuget"
    directory: "/Back-end/DVPerformance"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directory: "/Front-end"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
